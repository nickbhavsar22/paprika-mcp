services:
  - type: web
    name: paprika-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PAPRIKA_EMAIL
        sync: false
      - key: PAPRIKA_PASSWORD
        sync: false
      - key: MCP_BEARER_TOKEN
        generateValue: true
      # Optional: enables the web-image-search tier of find_free_thumbnail.
      # Without these, that tier is skipped and the chain still works.
      - key: GOOGLE_IMAGE_SEARCH_KEY
        sync: false
      - key: GOOGLE_IMAGE_SEARCH_CX
        sync: false
