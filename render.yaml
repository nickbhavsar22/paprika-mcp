services:
  - type: web
    name: paprika-mcp
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PAPRIKA_EMAIL
        sync: false
      - key: PAPRIKA_PASSWORD
        sync: false
      - key: MCP_BEARER_TOKEN
        generateValue: true
      # Optional: enables the stock-photo tier of find_free_thumbnail.
      # Without it, that tier is skipped and the chain still works.
      # Free instant key at https://www.pexels.com/api/
      - key: PEXELS_API_KEY
        sync: false
